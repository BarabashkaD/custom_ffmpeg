name: Build all deps + FFmpeg

on:
  push:
    branches: [master]
    # a version tag builds (from the caches of master) and drafts a release
    tags: ['v*']
    paths:
      - 'build/**'
      - 'patches/**'
      - 'compat/**'
      - 'docker/**'
      - 'cmake/**'
      - 'profiles/**'
      - 'sources/**'
      - 'tests/**'
      - 'tools/**'
      - 'versions.cmake'
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [master]
    # Docs-only changes (CLAUDE.md, README, docs/) do not need a ~1 h build
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # Weekly: everything from the caches, but the long dependency test suites run
  # (on other runs they are skipped on cache hits; see HEAVY_TESTS)
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      full_tests:
        description: 'Run the long dependency test suites on cache hits too'
        type: boolean
        default: false
      windows:
        description: 'Build windows-x64'
        type: boolean
        default: true
      linux:
        description: 'Build linux-x64'
        type: boolean
        default: true
      macos:
        description: 'Build macos-arm64'
        type: boolean
        default: true
      profiles:
        description: 'FFmpeg profiles'
        type: choice
        options: [all, full, lgpl, minimal]
        default: all
      types:
        description: 'FFmpeg build types'
        type: choice
        options: [both, static, shared]
        default: both

# A new push to the same PR/branch cancels the run still in progress.
# master keeps every run: each merge must produce complete artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Build caching: every deps matrix entry and every FFmpeg job caches its output
# under a content key from .github/scripts/cache_key.sh (submodule commits,
# scripts, patches, profiles, runner image). On a hit the job skips submodule
# checkout, toolchain setup and the build, and only restores + uploads/tests.

# CMake for the Windows host steps (official release, see .github/scripts/install_cmake.ps1)
env:
  CMAKE_VERSION: 4.2.8
  # Long test suites (<dep>/<name> in tests.tsv): run when the dependency was
  # rebuilt, on the weekly schedule and with full_tests; skipped on cache hits
  HEAVY_TESTS: svtav1/unit_tests,svtav1/e2e_tests,libvpx/test_libvpx

jobs:
  # ── Build & push Docker builder image to ghcr.io ────────────────────────────
  # The image is layer-cached in the registry, so re-runs where the Dockerfile
  # has not changed complete in seconds (all layers restored from cache).
  # The windows job pulls this pre-built image instead of rebuilding it every run.
  # Outputs: the pushed digest — the Windows jobs pull exactly this image, not
  # `:latest`, which another branch's run may have replaced meanwhile — and a
  # fingerprint of its installed packages (the Alpine packages are not pinned),
  # part of the Windows cache keys.
  build-image:
    name: Docker builder image
    if: github.event_name != 'workflow_dispatch' || inputs.windows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
      fingerprint: ${{ steps.fingerprint.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name (lowercase owner)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/custom-ffmpeg-builder" >> $GITHUB_OUTPUT

      - name: Build and push builder image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: docker/
          push: true
          tags: ${{ steps.image.outputs.name }}:latest
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max

      - name: Package fingerprint
        id: fingerprint
        run: |
          img="${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"
          docker pull -q "$img"
          echo "value=$(docker run --rm "$img" apk info -v | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

  # ── Linux deps matrix (native) ──────────────────────────────────────────────
  linux-deps:
    name: Deps — linux-x64 (${{ matrix.dep.name }})
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dep:
          - { name: zlib, args: "zlib" }
          - { name: libogg, args: "libogg" }
          - { name: libvorbis, args: "libogg libvorbis" }
          - { name: opus, args: "opus" }
          - { name: libvpx, args: "libvpx" }
          - { name: x264, args: "x264" }
          - { name: x265, args: "x265" }
          - { name: libwebp, args: "libwebp" }
          - { name: mp3lame, args: "mp3lame" }
          - { name: svtav1, args: "svtav1" }
          - { name: dav1d, args: "dav1d" }
          - { name: ffnvcodec, args: "ffnvcodec" }
          - { name: amf, args: "amf" }
          - { name: libvpl, args: "libvpl" }
          - { name: libdrm, args: "libdrm" }
          - { name: libva, args: "libdrm libva" }

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache key
        id: key
        run: echo "key=deps-linux-x64-${{ matrix.dep.name }}-$(bash .github/scripts/cache_key.sh linux-x64 deps ${{ matrix.dep.args }})" >> "$GITHUB_OUTPUT"

      - name: Restore cached build
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: prebuilt/.deps/linux-x64/
          key: ${{ steps.key.outputs.key }}

      - name: Checkout submodules
        if: steps.cache.outputs.cache-hit != 'true'
        run: git submodule update --init --recursive --depth 1

      - name: Install prerequisites
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang nasm cmake ninja-build meson pkg-config \
            autoconf automake libtool \
            python3 curl

      - name: Build dependency
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash build/build_linux.sh ${{ matrix.dep.args }}

      - name: Save build cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: prebuilt/.deps/linux-x64/
          key: ${{ steps.key.outputs.key }}

      # Runs on cache hits too: the dependency's own test programs and CLI
      # round trips (test vectors are a local, full-level run)
      - name: Dependency tests
        env:
          SKIP_TESTS: ${{ steps.cache.outputs.cache-hit == 'true' && github.event_name != 'schedule' && !inputs.full_tests && env.HEAVY_TESTS || '' }}
        run: |
          chmod -R +x prebuilt/.deps/linux-x64/bin prebuilt/.deps/linux-x64/tests 2>/dev/null || true
          python3 tests/deps/run_dep_tests.py prebuilt/.deps/linux-x64 \
            --only "$(echo '${{ matrix.dep.args }}' | tr ' ' ,)" --skip "$SKIP_TESTS"

      - name: Upload dep artifacts
        uses: actions/upload-artifact@v6
        with:
          name: deps-linux-x64-${{ matrix.dep.name }}
          path: prebuilt/.deps/linux-x64/
          retention-days: 7

  # ── Linux — FFmpeg (native, after deps matrix) ──────────────────────────────
  linux:
    name: FFmpeg — linux-x64 (${{ matrix.type }}, ${{ matrix.profile }})
    runs-on: ubuntu-24.04
    needs: linux-deps
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # one job per build type x profile (parallel); manual runs may pick one of each
        type: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.types != 'both') && format('["{0}"]', inputs.types) || '["static","shared"]') }}
        profile: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.profiles != 'all') && format('["{0}"]', inputs.profiles) || '["full","lgpl","minimal"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache key
        id: key
        run: |
          echo "key=ffmpeg-linux-x64-${{ matrix.type }}-${{ matrix.profile }}-$(bash .github/scripts/cache_key.sh linux-x64 ffmpeg ${{ matrix.type }} ${{ matrix.profile }})" >> "$GITHUB_OUTPUT"
          # FATE samples follow the FFmpeg version (its commit, no checkout needed)
          echo "ffmpeg=$(git rev-parse HEAD:sources/ffmpeg)" >> "$GITHUB_OUTPUT"

      - name: Restore cached build
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: prebuilt/linux-x64/${{ matrix.type }}/${{ matrix.profile }}/
          key: ${{ steps.key.outputs.key }}

      - name: Checkout submodules
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --recursive --depth 1
          bash .github/scripts/ffmpeg_tag.sh

      - name: Install prerequisites
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang nasm cmake ninja-build meson pkg-config \
            autoconf automake libtool \
            python3 curl

      - name: Download deps from matrix jobs
        uses: actions/download-artifact@v7
        with:
          pattern: deps-linux-x64-*
          path: prebuilt/.deps/linux-x64/
          merge-multiple: true

      - name: Build FFmpeg (linux-x64 ${{ matrix.type }})
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          shared=""; [ "${{ matrix.type }}" = shared ] && shared=--shared
          bash build/build_linux.sh --ffmpeg ${{ matrix.profile }} $shared

      - name: Consumer test (find_package(CustomFFmpeg), C and C++)
        run: |
          CC=clang CXX=clang++ bash tests/consumer/run.sh prebuilt/linux-x64/${{ matrix.type }}/${{ matrix.profile }}

      # FATE needs the build tree, so it runs on fresh static builds with
      # programs (not minimal). The fate-suite samples (~1.4 GB) are cached per
      # FFmpeg version; after an FFmpeg update the previous set is restored and
      # the fetch (rsync) brings only the difference, saved under the new key —
      # by the full job only (both FATE jobs run at the same time).
      - name: Restore FATE samples
        id: fate-cache
        if: steps.cache.outputs.cache-hit != 'true' && matrix.type == 'static' && matrix.profile != 'minimal'
        uses: actions/cache/restore@v5
        with:
          path: testdata/fate-suite/
          key: fate-suite-${{ steps.key.outputs.ffmpeg }}
          restore-keys: fate-suite-

      - name: Fetch FATE samples
        if: steps.cache.outputs.cache-hit != 'true' && matrix.type == 'static' && matrix.profile != 'minimal' && steps.fate-cache.outputs.cache-hit != 'true'
        run: bash tools/fetch_test_data.sh testdata fate

      - name: Save FATE samples
        if: steps.cache.outputs.cache-hit != 'true' && matrix.type == 'static' && matrix.profile == 'full' && steps.fate-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: testdata/fate-suite/
          key: fate-suite-${{ steps.key.outputs.ffmpeg }}

      - name: FATE
        if: steps.cache.outputs.cache-hit != 'true' && matrix.type == 'static' && matrix.profile != 'minimal'
        run: |
          bash tests/fate/run_fate.sh prebuilt/.build/ffmpeg-linux-x64-${{ matrix.type }}-${{ matrix.profile }} \
            --samples testdata/fate-suite

      - name: Save build cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: prebuilt/linux-x64/${{ matrix.type }}/${{ matrix.profile }}/
          key: ${{ steps.key.outputs.key }}

      # Release archive of this variant, checked like a user would: unpacked
      # into an empty directory, consumer test with the archive's own CMake module
      - name: Release archive (+ consumer test of the unpacked archive)
        run: |
          ver="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF" == refs/tags/v* ]] || ver="dev-${GITHUB_SHA::9}"
          a=$(python3 tools/package_release.py prebuilt linux-x64 ${{ matrix.type }} ${{ matrix.profile }} "$ver" --out dist)
          x="$RUNNER_TEMP/pkg"; mkdir -p "$x"; tar -xJf "$a" -C "$x"
          d="$x/$(basename "$a" .tar.xz)"
          CC=clang CXX=clang++ CUSTOM_FFMPEG_MODULE_DIR="$d/cmake" bash tests/consumer/run.sh "$d/linux-x64/${{ matrix.type }}/${{ matrix.profile }}" "$RUNNER_TEMP/pkg-consumer"

      - name: Upload release archive
        uses: actions/upload-artifact@v6
        with:
          name: release-linux-x64-${{ matrix.type }}-${{ matrix.profile }}
          path: dist/*
          retention-days: 7
          compression-level: 0
      - name: Upload FFmpeg artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-linux-x64-${{ matrix.type }}-${{ matrix.profile }}
          path: prebuilt/linux-x64/${{ matrix.type }}/${{ matrix.profile }}/
          retention-days: 7

  # ── Windows deps matrix (Docker in WSL2) ─────────────────────────────────────
  # windows-2025: Visual Studio 2026 with the v143 toolset component (MSVC 14.44,
  # the VS 2022 line the libraries are built with) and WSL2 preinstalled, so
  # setup-wsl skips `wsl --update` (403 now and then on windows-2022). CMake
  # >= 4.2 for the VS 2026 generator of the consumer test. The small deps share
  # one job: each job pays ~2 min of WSL + Docker setup, the run has 20 slots.
  windows-deps:
    name: Deps — windows-x64 (${{ matrix.dep.name }})
    runs-on: windows-2025
    needs: build-image
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        dep:
          # build order = argument order (libogg before libvorbis)
          - { name: small, args: "zlib libogg libvorbis opus mp3lame libwebp ffnvcodec amf" }
          - { name: libvpx, args: "libvpx" }
          - { name: x264, args: "x264" }
          - { name: x265, args: "x265" }
          - { name: svtav1, args: "svtav1" }
          - { name: dav1d, args: "dav1d" }
          - { name: libvpl, args: "libvpl" }

    steps:
      - name: Disable CRLF auto-conversion (must be before checkout)
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install CMake
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/install_cmake.ps1 -Version ${{ env.CMAKE_VERSION }}

      # Before the cache key: the key holds the MSVC / Windows SDK versions
      - name: Generate config (Windows host)
        run: ./.github/scripts/windows_config.ps1 -Type static -Profile full

      - name: Cache key
        id: key
        shell: bash
        env:
          BUILDER_FINGERPRINT: ${{ needs.build-image.outputs.fingerprint }}
        run: echo "key=deps-windows-x64-${{ matrix.dep.name }}-$(bash .github/scripts/cache_key.sh windows-x64 deps ${{ matrix.dep.args }})" >> "$GITHUB_OUTPUT"

      - name: Restore cached build
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: prebuilt/.deps/windows-x64/
          key: ${{ steps.key.outputs.key }}

      # Only the submodules these deps build from (an empty list would mean all)
      - name: Checkout submodules
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          paths=$(bash .github/scripts/dep_submodules.sh ${{ matrix.dep.args }})
          if [ -n "$paths" ]; then
            git submodule update --init --recursive --depth 1 -- $paths
          fi

      # SDK/MSVC/compat (+ deps) packed on the Windows side, unpacked onto WSL's ext4
      - name: Stage toolchain files
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./.github/scripts/windows_stage.ps1 -Out "${{ runner.temp }}/stage"

      - name: Set up WSL2 Ubuntu with Docker
        if: steps.cache.outputs.cache-hit != 'true'
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          additional-packages: docker.io

      - name: Build dependency (Docker inside WSL2)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: wsl-bash {0}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_IMAGE: ${{ needs.build-image.outputs.image }}
          WSLENV: GHCR_TOKEN/u:GHCR_ACTOR/u:GHCR_IMAGE/u
        run: |
          set -euo pipefail

          sudo service docker start
          timeout 30 bash -c 'until docker info &>/dev/null; do sleep 1; done'

          # wslpath converts Windows backslash paths → Linux /mnt/... paths
          REPO=$(wslpath '${{ github.workspace }}')
          # Toolchain files from the staged tars onto WSL's ext4 (+ case aliases):
          # the container reads them natively instead of through 9p drive mounts
          STAGE=$HOME/stage
          bash "$REPO/.github/scripts/windows_unstage.sh" "$(wslpath '${{ runner.temp }}')/stage" "$STAGE"
          DEPS_MOUNT=()
          [ -d "$STAGE/deps" ] && DEPS_MOUNT=(-v "$STAGE/deps:/artifacts/.deps/windows-x64")

          # Pull pre-built image from ghcr.io (built by the build-image job).
          # ghcr.io package names are lowercase; normalise here to be explicit.
          IMAGE_LOWER=$(echo "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          docker pull "$IMAGE_LOWER"
          docker tag  "$IMAGE_LOWER" custom-ffmpeg-builder

          # CPU / I/O load while building: vmstat every 15 s, averages at the end
          # (high user% = CPU-bound; idle/iowait while compiling = waiting for files)
          vmstat -n 15 > /tmp/vmstat.log &
          VMSTAT=$!
          trap 'kill $VMSTAT 2>/dev/null; awk "NR == 2 { for (i = 1; i <= NF; i++) c[\$i] = i; next } NR > 3 && \$1 ~ /^[0-9]+\$/ { n++; for (k in c) s[k] += \$c[k] } END { if (n) printf \"vmstat: %d samples x 15 s: user %.0f%%, sys %.0f%%, idle %.0f%%, iowait %.0f%%, run queue %.1f, blocked %.1f\\n\", n, s[\"us\"]/n, s[\"sy\"]/n, s[\"id\"]/n, s[\"wa\"]/n, s[\"r\"]/n, s[\"b\"]/n }" /tmp/vmstat.log' EXIT

          docker run --rm \
            -v "$REPO:/src" \
            -v "$REPO/prebuilt:/artifacts" \
            -v "$REPO/generated:/configs:ro" \
            -v "$STAGE/compat:/src/compat:ro" \
            "${DEPS_MOUNT[@]}" \
            -v "$STAGE/kits:/winsdk/kits:ro" \
            -v "$STAGE/msvc:/winsdk/msvc:ro" \
            custom-ffmpeg-builder \
            bash -lc "ONLY_DEPS='${{ matrix.dep.args }}' bash /src/build/build_ffmpeg.sh /configs/windows-x64-static-full.env"

      - name: Save build cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: prebuilt/.deps/windows-x64/
          key: ${{ steps.key.outputs.key }}

      # Windows host — the PE test programs and tools run natively
      - name: Dependency tests
        env:
          SKIP_TESTS: ${{ steps.cache.outputs.cache-hit == 'true' && github.event_name != 'schedule' && !inputs.full_tests && env.HEAVY_TESTS || '' }}
        run: |
          python tests/deps/run_dep_tests.py prebuilt\.deps\windows-x64 `
            --only ('${{ matrix.dep.args }}' -replace ' ', ',') --skip "$env:SKIP_TESTS"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload dep artifacts
        uses: actions/upload-artifact@v6
        with:
          name: deps-windows-x64-${{ matrix.dep.name }}
          path: prebuilt\.deps\windows-x64\
          retention-days: 7

      - name: Disk space
        if: always()
        continue-on-error: true
        run: ./.github/scripts/disk_space.ps1

  # ── Windows — FFmpeg (Docker in WSL2, after deps matrix) ────────────────────
  windows:
    name: FFmpeg — windows-x64 (${{ matrix.type }}, ${{ matrix.profile }})
    runs-on: windows-2025
    needs: [build-image, windows-deps]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # one job per build type x profile (parallel); manual runs may pick one of each
        type: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.types != 'both') && format('["{0}"]', inputs.types) || '["static","shared"]') }}
        profile: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.profiles != 'all') && format('["{0}"]', inputs.profiles) || '["full","lgpl","minimal"]') }}
    steps:
      - name: Disable CRLF auto-conversion (must be before checkout)
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install CMake
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/install_cmake.ps1 -Version ${{ env.CMAKE_VERSION }}

      # Before the cache key: the key holds the MSVC / Windows SDK versions
      - name: Generate config (Windows host)
        run: ./.github/scripts/windows_config.ps1 -Type ${{ matrix.type }} -Profile ${{ matrix.profile }}

      - name: Cache key
        id: key
        shell: bash
        env:
          BUILDER_FINGERPRINT: ${{ needs.build-image.outputs.fingerprint }}
        run: echo "key=ffmpeg-windows-x64-${{ matrix.type }}-${{ matrix.profile }}-$(bash .github/scripts/cache_key.sh windows-x64 ffmpeg ${{ matrix.type }} ${{ matrix.profile }})" >> "$GITHUB_OUTPUT"

      - name: Restore cached build
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: prebuilt/windows-x64/${{ matrix.type }}/${{ matrix.profile }}/
          key: ${{ steps.key.outputs.key }}

      # SKIP_DEPS build: FFmpeg's own sources only (deps come as artifacts)
      - name: Checkout submodules
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git submodule update --init --recursive --depth 1 -- sources/ffmpeg
          bash .github/scripts/ffmpeg_tag.sh

      - name: Download deps from matrix jobs
        uses: actions/download-artifact@v7
        with:
          pattern: deps-windows-x64-*
          path: prebuilt\.deps\windows-x64\
          merge-multiple: true

      # SDK/MSVC/compat + deps packed on the Windows side, unpacked onto WSL's ext4
      - name: Stage toolchain files
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./.github/scripts/windows_stage.ps1 -Out "${{ runner.temp }}/stage" -Deps

      - name: Set up WSL2 Ubuntu with Docker
        if: steps.cache.outputs.cache-hit != 'true'
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          additional-packages: docker.io

      - name: Build FFmpeg ${{ matrix.type }} (Docker inside WSL2)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: wsl-bash {0}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_IMAGE: ${{ needs.build-image.outputs.image }}
          WSLENV: GHCR_TOKEN/u:GHCR_ACTOR/u:GHCR_IMAGE/u
        run: |
          set -euo pipefail

          sudo service docker start
          timeout 30 bash -c 'until docker info &>/dev/null; do sleep 1; done'

          # wslpath converts Windows backslash paths → Linux /mnt/... paths
          REPO=$(wslpath '${{ github.workspace }}')
          # Toolchain files from the staged tars onto WSL's ext4 (+ case aliases):
          # the container reads them natively instead of through 9p drive mounts
          STAGE=$HOME/stage
          bash "$REPO/.github/scripts/windows_unstage.sh" "$(wslpath '${{ runner.temp }}')/stage" "$STAGE"
          DEPS_MOUNT=()
          [ -d "$STAGE/deps" ] && DEPS_MOUNT=(-v "$STAGE/deps:/artifacts/.deps/windows-x64")

          # Pull pre-built image from ghcr.io (built by the build-image job).
          # ghcr.io package names are lowercase; normalise here to be explicit.
          IMAGE_LOWER=$(echo "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          docker pull "$IMAGE_LOWER"
          docker tag  "$IMAGE_LOWER" custom-ffmpeg-builder

          # CPU / I/O load while building: vmstat every 15 s, averages at the end
          # (high user% = CPU-bound; idle/iowait while compiling = waiting for files)
          vmstat -n 15 > /tmp/vmstat.log &
          VMSTAT=$!
          trap 'kill $VMSTAT 2>/dev/null; awk "NR == 2 { for (i = 1; i <= NF; i++) c[\$i] = i; next } NR > 3 && \$1 ~ /^[0-9]+\$/ { n++; for (k in c) s[k] += \$c[k] } END { if (n) printf \"vmstat: %d samples x 15 s: user %.0f%%, sys %.0f%%, idle %.0f%%, iowait %.0f%%, run queue %.1f, blocked %.1f\\n\", n, s[\"us\"]/n, s[\"sy\"]/n, s[\"id\"]/n, s[\"wa\"]/n, s[\"r\"]/n, s[\"b\"]/n }" /tmp/vmstat.log' EXIT

          docker run --rm \
            -v "$REPO:/src" \
            -v "$REPO/prebuilt:/artifacts" \
            -v "$REPO/generated:/configs:ro" \
            -v "$STAGE/compat:/src/compat:ro" \
            "${DEPS_MOUNT[@]}" \
            -v "$STAGE/kits:/winsdk/kits:ro" \
            -v "$STAGE/msvc:/winsdk/msvc:ro" \
            custom-ffmpeg-builder \
            bash -lc "set -e; export SKIP_DEPS=1; bash /src/build/build_ffmpeg.sh /configs/windows-x64-${{ matrix.type }}-${{ matrix.profile }}.env"

      - name: Consumer test (MSVC — find_package(CustomFFmpeg), C/C++ x Release/Debug)
        run: |
          .\tests\consumer\run.ps1 -FFmpegRoot "prebuilt\windows-x64\${{ matrix.type }}\${{ matrix.profile }}"

      - name: Save build cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: prebuilt/windows-x64/${{ matrix.type }}/${{ matrix.profile }}/
          key: ${{ steps.key.outputs.key }}

      # Release archive of this variant, checked like a user would: unpacked
      # into an empty directory, consumer test with the archive's own CMake module
      - name: Release archive (+ consumer test of the unpacked archive)
        run: |
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { "dev-$($env:GITHUB_SHA.Substring(0, 9))" }
          $a = python tools/package_release.py prebuilt windows-x64 ${{ matrix.type }} ${{ matrix.profile }} $ver --out dist
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $x = Join-Path $env:RUNNER_TEMP pkg
          Expand-Archive $a $x -Force
          $d = Join-Path $x ([IO.Path]::GetFileNameWithoutExtension($a))
          $env:CUSTOM_FFMPEG_MODULE_DIR = "$d/cmake"
          ./tests/consumer/run.ps1 -FFmpegRoot "$d/windows-x64/${{ matrix.type }}/${{ matrix.profile }}" -BuildDir "$env:RUNNER_TEMP/pkg-consumer"

      - name: Upload release archive
        uses: actions/upload-artifact@v6
        with:
          name: release-windows-x64-${{ matrix.type }}-${{ matrix.profile }}
          path: dist/*
          retention-days: 7
          compression-level: 0
      - name: Upload FFmpeg artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-windows-x64-${{ matrix.type }}-${{ matrix.profile }}
          path: prebuilt/windows-x64/${{ matrix.type }}/${{ matrix.profile }}/
          retention-days: 7

      - name: Disk space
        if: always()
        continue-on-error: true
        run: ./.github/scripts/disk_space.ps1

  # ── macOS ARM64 deps matrix (native) ─────────────────────────────────────────
  macos-deps:
    name: Deps — macos-arm64 (${{ matrix.dep.name }})
    if: github.event_name != 'workflow_dispatch' || inputs.macos
    runs-on: xcode-27   # macOS 27 on Apple silicon (images are named by Xcode version)
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dep:
          - { name: zlib, args: "zlib" }
          - { name: libogg, args: "libogg" }
          - { name: libvorbis, args: "libogg libvorbis" }
          - { name: opus, args: "opus" }
          - { name: libvpx, args: "libvpx" }
          - { name: x264, args: "x264" }
          - { name: x265, args: "x265" }
          - { name: libwebp, args: "libwebp" }
          - { name: mp3lame, args: "mp3lame" }
          - { name: svtav1, args: "svtav1" }
          - { name: dav1d, args: "dav1d" }
          # ffnvcodec / amf / libvpl: no NVIDIA / AMD / Intel QSV support on macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache key
        id: key
        run: echo "key=deps-macos-arm64-${{ matrix.dep.name }}-$(bash .github/scripts/cache_key.sh macos-arm64 deps ${{ matrix.dep.args }})" >> "$GITHUB_OUTPUT"

      - name: Restore cached build
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: prebuilt/.deps/macos-arm64/
          key: ${{ steps.key.outputs.key }}

      - name: Checkout submodules
        if: steps.cache.outputs.cache-hit != 'true'
        run: git submodule update --init --recursive --depth 1

      - name: Install prerequisites
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install cmake pkg-config autoconf automake libtool ninja meson

      - name: Build dependency
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash build/build_macos.sh ${{ matrix.dep.args }}

      - name: Save build cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: prebuilt/.deps/macos-arm64/
          key: ${{ steps.key.outputs.key }}

      - name: Dependency tests
        env:
          SKIP_TESTS: ${{ steps.cache.outputs.cache-hit == 'true' && github.event_name != 'schedule' && !inputs.full_tests && env.HEAVY_TESTS || '' }}
        run: |
          chmod -R +x prebuilt/.deps/macos-arm64/bin prebuilt/.deps/macos-arm64/tests 2>/dev/null || true
          python3 tests/deps/run_dep_tests.py prebuilt/.deps/macos-arm64 \
            --only "$(echo '${{ matrix.dep.args }}' | tr ' ' ,)" --skip "$SKIP_TESTS"

      - name: Upload dep artifacts
        uses: actions/upload-artifact@v6
        with:
          name: deps-macos-arm64-${{ matrix.dep.name }}
          path: prebuilt/.deps/macos-arm64/
          retention-days: 7

  # ── macOS ARM64 — FFmpeg (native, after deps matrix) ─────────────────────────
  macos:
    name: FFmpeg — macos-arm64 (${{ matrix.type }}, ${{ matrix.profile }})
    runs-on: xcode-27   # macOS 27 on Apple silicon (images are named by Xcode version)
    needs: macos-deps
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # one job per build type x profile (parallel); manual runs may pick one of each
        type: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.types != 'both') && format('["{0}"]', inputs.types) || '["static","shared"]') }}
        profile: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.profiles != 'all') && format('["{0}"]', inputs.profiles) || '["full","lgpl","minimal"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache key
        id: key
        run: echo "key=ffmpeg-macos-arm64-${{ matrix.type }}-${{ matrix.profile }}-$(bash .github/scripts/cache_key.sh macos-arm64 ffmpeg ${{ matrix.type }} ${{ matrix.profile }})" >> "$GITHUB_OUTPUT"

      - name: Restore cached build
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: prebuilt/macos-arm64/${{ matrix.type }}/${{ matrix.profile }}/
          key: ${{ steps.key.outputs.key }}

      - name: Checkout submodules
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --recursive --depth 1
          bash .github/scripts/ffmpeg_tag.sh

      - name: Install prerequisites
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install cmake pkg-config autoconf automake libtool ninja meson

      - name: Download deps from matrix jobs
        uses: actions/download-artifact@v7
        with:
          pattern: deps-macos-arm64-*
          path: prebuilt/.deps/macos-arm64/
          merge-multiple: true

      # Xcode 26+ ships the Metal compiler as a separate component (lgpl/full
      # enable Metal for the VideoToolbox filters)
      - name: Install the Metal toolchain
        if: steps.cache.outputs.cache-hit != 'true' && matrix.profile != 'minimal'
        run: |
          xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal -v

      - name: Build FFmpeg (macos-arm64 ${{ matrix.type }})
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          shared=""; [ "${{ matrix.type }}" = shared ] && shared=--shared
          bash build/build_macos.sh --ffmpeg ${{ matrix.profile }} $shared

      - name: Consumer test (find_package(CustomFFmpeg), C and C++)
        run: |
          bash tests/consumer/run.sh prebuilt/macos-arm64/${{ matrix.type }}/${{ matrix.profile }}

      # FATE without samples (internal tests, checkasm, generated data) on
      # fresh static builds with programs
      - name: FATE
        if: steps.cache.outputs.cache-hit != 'true' && matrix.type == 'static' && matrix.profile != 'minimal'
        run: bash tests/fate/run_fate.sh prebuilt/.build/ffmpeg-macos-arm64-${{ matrix.type }}-${{ matrix.profile }}

      - name: Save build cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: prebuilt/macos-arm64/${{ matrix.type }}/${{ matrix.profile }}/
          key: ${{ steps.key.outputs.key }}

      # Release archive of this variant, checked like a user would: unpacked
      # into an empty directory, consumer test with the archive's own CMake module
      - name: Release archive (+ consumer test of the unpacked archive)
        run: |
          ver="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF" == refs/tags/v* ]] || ver="dev-${GITHUB_SHA::9}"
          a=$(python3 tools/package_release.py prebuilt macos-arm64 ${{ matrix.type }} ${{ matrix.profile }} "$ver" --out dist)
          x="$RUNNER_TEMP/pkg"; mkdir -p "$x"; tar -xJf "$a" -C "$x"
          d="$x/$(basename "$a" .tar.xz)"
          CUSTOM_FFMPEG_MODULE_DIR="$d/cmake" bash tests/consumer/run.sh "$d/macos-arm64/${{ matrix.type }}/${{ matrix.profile }}" "$RUNNER_TEMP/pkg-consumer"

      - name: Upload release archive
        uses: actions/upload-artifact@v6
        with:
          name: release-macos-arm64-${{ matrix.type }}-${{ matrix.profile }}
          path: dist/*
          retention-days: 7
          compression-level: 0
      - name: Upload FFmpeg artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-macos-arm64-${{ matrix.type }}-${{ matrix.profile }}
          path: prebuilt/macos-arm64/${{ matrix.type }}/${{ matrix.profile }}/
          retention-days: 7

  # ── Release (version tags only) ──────────────────────────────────────────────
  # The archives of all FFmpeg jobs, their SHA-256 list and build provenance
  # attestations, as a DRAFT release: published by hand after a look at it.
  release:
    name: Release (draft)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release archives
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum custom_ffmpeg-* > SHA256SUMS
          cat SHA256SUMS

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/custom_ffmpeg-*'

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          python3 tools/release_notes.py "$ver" dist > notes.md
          ffmpeg=$(sed -n 's/^FFmpeg \*\*\(.*\)\*\* .*/\1/p' notes.md | head -n 1)
          pre=(); [[ "$ver" == *-* ]] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --draft "${pre[@]}" --verify-tag \
            --title "custom_ffmpeg $ver (FFmpeg $ffmpeg)" --notes-file notes.md \
            dist/custom_ffmpeg-* dist/SHA256SUMS